<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de pedidos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="../js/pedidos.js" defer></script>
</head>
<body>
    <div class="container mt-4">
        <h1>Gestión de pedidos de una cafetería</h1>

        <h3 class="mt-4">Registrar pedido</h3>

        <form id="formPedidos">
            <div class="mb-3">
                <label for="producto" class="form-label">Producto</label>
                <input type="text" class="form-control" id="producto" required>
            </div>

            <div class="mb-3">
                <label for="precio" class="form-label">Precio unitario</label>
                <input type="number" class="form-control" id="precio" step="any" required>
            </div>

            <div class="mb-3">
                <label for="cantidad" class="form-label">Cantidad</label>
                <input type="number" class="form-control" id="cantidad" step="1" required>
            </div>

            <button type="submit" class="btn btn-primary">Agregar pedido</button>
        </form>

        <h3 class="mt-4">Filtrar productos</h3>

        <div class="mb-3">
            <label for="precioMaximo" class="form-label">Precio máximo</label>
            <input type="number" class="form-control" id="precioMaximo" step="any">
        </div>

        <button id="btnFiltrar" class="btn btn-primary">Filtrar productos</button>
        <button id="btnMostrar" class="btn btn-secondary">Mostrar todos</button>
        <button id="btnLimpiar" class="btn btn-danger">Limpiar pedidos</button>

        <h3 class="mt-4">Pedidos registrados</h3>

        <table class="table table-bordered">
            <thead>
                <tr>
                    <th>Producto</th>
                    <th>Precio unitario</th>
                    <th>Cantidad</th>
                    <th>Subtotal</th>
                </tr>
            </thead>
            <tbody id="tablaPedidos"></tbody>
        </table>

        <p>Total de unidades: <span id="totalUnidades">0</span></p>
        <p>Monto total: $<span id="montoTotal">0.00</span></p>

        <a href="../index.html" class="btn btn-primary">Regresar</a>
    </div>
</body>
</html>
